<!DOCTYPE html>
<html>
<head>
  <title>Video Summary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Roboto', sans-serif;
      line-height: 1.8;
      padding: 2em;
      max-width: 800px;
      margin: 0 auto;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      color: #d32f2f;
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.5em;
    }
    #summary-content {
      background-color: #fff;
      padding: 1.5em;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    #summary-content h2 { font-size: 1.3em; margin-top: 1.2em; color: #222; }
    #summary-content h3 { font-size: 1.1em; margin-top: 1em; color: #444; }
    #summary-content p { margin: 0.8em 0; }
    #summary-content strong { color: #d32f2f; }
    #summary-content ul { padding-left: 1.5em; }
    #summary-content li { margin: 0.3em 0; }
    #summary-content code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    #summary-content blockquote { border-left: 3px solid #d32f2f; padding-left: 1em; color: #555; margin: 1em 0; }
  </style>
</head>
<body>
  <h1>Video Summary</h1>
  <div id="summary-content">Loading...</div>
  <script src="summary.js"></script>
</body>
</html>
